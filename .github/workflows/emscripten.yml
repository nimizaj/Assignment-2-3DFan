name: Build and Deploy WebGL (Emscripten)

# This triggers the workflow every time you push to the 'main' branch
on:
  push:
    branches:
      - main 

# Grants the necessary permissions for GitHub Actions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents multiple deployments from running at the exact same time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the Emscripten SDK on the GitHub runner
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      # ----------------------------------------------------
      # NEW STEP: Install C++ Build Tools (CMake and Make)
      # ----------------------------------------------------
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make

      # Runs the assignment's provided build script
      - name: Build Web Target
        run: |
          chmod +x build_web.sh
          ./build_web.sh

      # Uploads the 'web' folder generated by the build script
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      # Deploys the uploaded artifact to your GitHub Pages URL
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4